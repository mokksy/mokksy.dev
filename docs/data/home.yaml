# Homepage marketing copy (Hugo: hugo.Data.home). Hero carousel code: content/home/examples/*.md
# Layout: themes/mokksy/layouts/index.html + partials/home/*.html
# Feature grid cards: params.features in config/_default/params.yaml

hero:
  aria_label: Hero
  mascot_alt: Mokksy mascot
  badge:
    - "Java and Kotlin"
    - "Integration Testing"
    - "Open Source"
  title:
    prefix: "Mock "
    highlight: HTTP APIs
    suffix: with real-world behavior
  sub: |
    Mokksy is a mock Streaming HTTP and SSE server for deterministic Java and Kotlin
    integration testing. Test streaming APIs, retries, timeouts, and failure paths
    through real HTTP behavior. Testing AI providers? Use AI-Mocks, built on Mokksy.
  primary_cta:
    label: Start with Mokksy
    url: /docs/mokksy/quick-start/
  secondary_cta:
    label: Explore AI-Mocks
    url: /docs/ai-mocks/
  github_cta:
    label: ⭐ Star on GitHub
  carousel:
    aria_label: Code examples carousel
    prev_aria: Previous example
    next_aria: Next example
    copy_label: Copy
    copy_aria: Copy code

why:
  aria_label: What problem Mokksy solves
  label: Why it matters
  title: Catch failures before production
  sub: |
    Unit tests don’t cover timeouts, retries, or streaming behavior.
    Mokksy lets you test real HTTP interactions — including slow responses,
    partial streams, and connection drops — in a deterministic way.

integrations:
  aria_label: Supported integrations
  label: "Integration paths"
  title: "Use the right layer for your dependency"
  groups:
    - title: "HTTP integration testing with Mokksy"
      chips:
        - { text: "🧩 Ktor", url: /docs/mokksy/ktor/ }
        - { text: "🌱 Spring Boot", url: /docs/integrations/spring-boot/ }
        - { text: "🚀 Quarkus", url: /docs/integrations/quarkus/ }
    - title: "AI provider testing with AI-Mocks"
      chips:
        - { text: "✦ OpenAI SDK", url: /docs/integrations/openai-sdk/ }
        - { text: "🤖 Anthropic SDK", url: /docs/integrations/anthropic-sdk/ }
        - { text: "⛓🦜 LangChain4j", url: /docs/integrations/langchain4j/ }
        - { text: "🧠 Koog with OpenAI", url: /docs/integrations/koog/ }
        - { text: "🌿 Spring AI", url: /docs/integrations/spring-ai/ }

features_section:
  aria_label: Features
  id: features
  label: Why Mokksy
  title_line1: Test real HTTP behavior
  title_line2: with confidence
  sub: |
    Mock streaming APIs, slow responses, retries, partial failures, and
    connection-sensitive clients in repeatable Kotlin and Java integration tests.

products:
  label: Choose a product
  title: "Choose the testing layer you need"
  aria_label: Mokksy and AI-Mocks
  sub_html: |
    <em>Mokksy</em> is the core HTTP and SSE mock server.
    <em>AI-Mocks</em> adds provider-compatible AI testing on top of Mokksy.
  cards:
    - href: /docs/mokksy/
      title: Mokksy
      description: Mock any HTTP or SSE dependency with controlled responses, streaming chunks, delays, failures, uploads, and request verification.
      action: Start with Mokksy
      delay: "0.1s"
    - href: /docs/ai-mocks/
      title: AI-Mocks
      description: Test OpenAI, Anthropic, Gemini, Ollama, and A2A clients with provider-compatible behavior and no real API calls.
      action: Start with AI-Mocks
      delay: "0.3s"
  bullets:
    - "<strong>Streaming & SSE:</strong> realistic response streams"
    - "<strong>Fine-grained control:</strong> define behaviour programmatically"
    - "<strong>Delay simulation:</strong> chunk-level or total latency"
    - "<strong>Failure scenarios:</strong> test errors and slow responses"
    - "<strong>Kotlin DSL:</strong> concise API designed for tests"
  bullets_delay: "0.5s"

cta:
  title: Test external services without external risk
  sub: "Use Mokksy for real HTTP and streaming behavior. Use AI-Mocks for provider-compatible AI tests without API keys, rate limits, or provider outages."
  aria_label: Call to action
  primary:
    label: Start with Mokksy
    url: /docs/mokksy/quick-start/
  secondary:
    label: Explore AI-Mocks
    url: /docs/ai-mocks/
  github_secondary:
    label: ⭐ Star on GitHub
